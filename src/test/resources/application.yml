spring:
  cloud:
    bus:
      enabled: false
    config:
      enabled: false
    discovery:
      enabled: false
  config:
    import: "optional:configserver:"
  datasource:
    url: jdbc:h2:mem:community;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

eureka:
  client:
    enabled: false

navio:
  security:
    keycloak:
      issuer-uri: http://localhost:8180/realms/navio
      jwk-set-uri: http://localhost:8180/realms/navio/protocol/openid-connect/certs
      audiences: navio-api
  community:
    media:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: navio-community-test
      path-style: true
      public-base-url: http://localhost:8080

logging:
  level:
    root: WARN
    org.springframework: WARN

management:
  tracing:
    export:
      zipkin:
        enabled: false
